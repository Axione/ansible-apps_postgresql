---
- name: Run role
  hosts: all
  become: true
  any_errors_fatal: true
  gather_facts: false

  pre_tasks:
    - name: Get minimal facts
      ansible.builtin.setup:
        gather_subset:
          - '!all'
          - 'distribution'

  tasks:
    - name: Include role
      ansible.builtin.include_role:
        name: ansible-apps_postgresql
      vars:
        postgresql_version: 18
        postgresql_data_dir: "/data/postdata/{{ postgresql_version }}/data"
        postgresql_config_path: "{{ postgresql_data_dir }}"
        postgresql_hba_entries:
          - type: local
            database: all
            user: all
            auth_method: md5
          - type: host
            database: all
            user: all
            address: 127.0.0.1/32
            auth_method: md5
          - type: host
            database: all
            user: all
            address: 10.1.80.0/22
            auth_method: md5
          - type: host
            database: all
            user: all
            address: 10.1.98.0/24
            auth_method: md5
          - type: host
            database: all
            user: all
            address: 10.1.104.0/24
            auth_method: md5
          - type: host
            database: all
            user: all
            address: 10.1.206.0/24
            auth_method: md5
          - type: host
            database: all
            user: all
            address: 10.1.208.0/24
            auth_method: md5
          - type: host
            database: all
            user: all
            address: 10.4.40.0/24
            auth_method: md5

        postgresql_global_config_options:
          - option: log_directory
            value: /var/log/postgresql
          - option: log_filename
            value: postgresql-%a.log
          - option: log_file_mode
            value: '0666'
          - option: log_truncate_on_rotation
            value: 'on'
          - option: log_line_prefix
            value: '%m [%d // %u // %h // %p] '
          - option: log_statement
            value: ddl
          - option: listen_addresses
            value: '*'
          - option: max_connections
            value: '200'
          - option: shared_buffers
            value: 1536MB
          - option: effective_cache_size
            value: 4608MB
          - option: maintenance_work_mem
            value: 384MB
          - option: max_wal_size
            value: 4GB
          - option: min_wal_size
            value: 1GB
          - option: log_min_duration_statement
            value: '5000'
          - option: default_text_search_config
            value: pg_catalog.french
          - option: lc_messages
            value: fr_FR.UTF-8
          - option: lc_monetary
            value: fr_FR.UTF-8
          - option: lc_numeric
            value: fr_FR.UTF-8
          - option: lc_time
            value: fr_FR.UTF-8
          - option: password_encryption
            value: scram-sha-256
          - option: wal_compression
            value: true
          - option: max_worker_processes
            value: 8
          - option: max_parallel_workers_per_gather
            value: 2
          - option: max_parallel_workers
            value: 4
          - option: max_parallel_maintenance_workers
            value: 2
          - option: work_mem
            value: 6MB
          - option: jit
            value: 'off'
